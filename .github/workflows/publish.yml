name: Publish

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the contracts
        run: npm run build

      - name: Type-check the tests
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets npm authenticate with trusted publishing (OIDC), configured on npmjs.com.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # The trusted publisher may only stage the package: a maintainer then publishes it with 2FA,
      # e.g. with `npm stage list` and `npm stage approve <stage-id>`.
      - name: Stage the package on NPM
        run: npm stage publish --provenance
