[package]
name = "poseidon2-sol"
version = "1.0.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
starkom-bluesky = "4.0.1"
starkom-ff = "5.0.2"
starkom-poseidon2 = { version = "7.1.3", features = ["bluesky"] }

[[bin]]
name = "codegen"
path = "src/codegen.rs"

[[bin]]
name = "vectors"
path = "src/vectors.rs"
